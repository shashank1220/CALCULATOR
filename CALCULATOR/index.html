<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table id="calculator">
        <tr>
            <td colspan="3"><input type="text" placeholder="enter the numbers" id="result" name="result"></td>
            <td><input type="button" id="C" name="clear" value="c"></td>
        </tr>
        <tr>
            <td><input type="button" id="7" name="7" value="7"></td>
            <td><input type="button" id="8" name="8" value="8"></td>
            <td><input type="button" id="9" name="9" value="9"></td>
            <td><input type="button" id="*" name="*" value="*"></td>
        </tr>

        <tr>
            <td><input type="button" id="4" name="4" value="4"></td>
            <td><input type="button" id="5" name="5" value="5"></td>
            <td><input type="button" id="6" name="6" value="6"></td>
            <td><input type="button" id="/" name="/" value="/"></td>
        </tr>

        <tr>
            <td><input type="button" id="1" name="1" value="1"></td>
            <td><input type="button" id="2" name="2" value="2"></td>
            <td><input type="button" id="3" name="3" value="3"></td>
            <td><input type="button" id="-" name="-" value="-"></td>
        </tr>

        <tr>
            <td><input type="button" id="=" name="=" value="="></td>
            <td><input type="button" id="0" name="0" value="0"></td>
            <td><input type="button" id="." name="." value="."></td>
            <td><input type="button" id="+" name="+" value="+"></td>
        </tr>
    </table>
    
</body>
</html>
